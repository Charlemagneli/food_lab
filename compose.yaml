services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    volumes:
      - foodlab-data:/app/instance
      - foodlab-uploads:/app/frontend/images/uploads
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["80:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
volumes:
  foodlab-data:
  foodlab-uploads:
