<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布菜谱 · 食研所</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="site-header"></div><main class="form-wrap container"><div class="panel"><span class="eyebrow">Share your table</span><h1>发布一道菜</h1><form id="recipe-form" enctype="multipart/form-data"><div class="field"><label>菜谱名称</label><input name="title" required></div><div class="field"><label>简介</label><textarea name="description" rows="3"></textarea></div><div class="form-grid"><div class="field"><label>菜系</label><input name="cuisine" placeholder="如：中国菜"></div><div class="field"><label>类型</label><input name="meal_type" placeholder="如：晚餐"></div><div class="field"><label>难度</label><select name="difficulty"><option>简单</option><option>中等</option><option>困难</option></select></div><div class="field"><label>份量</label><input name="servings" type="number" min="1" value="2"></div><div class="field"><label>准备时间（分钟）</label><input name="prep_time" type="number" min="0" value="5"></div><div class="field"><label>烹饪时间（分钟）</label><input name="cook_time" type="number" min="0" value="10"></div></div><div class="field"><label>封面图片</label><input name="cover_image" type="file" accept="image/*"></div><div class="field"><label>食材</label><div id="ingredients"></div><button type="button" class="btn secondary" id="add-ingredient">＋ 添加食材</button></div><div class="field"><label>步骤</label><div id="steps"></div><button type="button" class="btn secondary" id="add-step">＋ 添加步骤</button></div><div class="field"><label>标签（逗号分隔）</label><input name="tags" placeholder="家常菜,快手菜"></div><div class="actions"><button class="btn" name="status" value="pending">提交审核</button><button class="btn secondary" name="status" value="draft">保存草稿</button></div></form></div></main><div id="site-footer"></div><div id="toast" class="toast"></div><script src="/js/main.js"></script><script src="/js/publish.js"></script></body></html>
