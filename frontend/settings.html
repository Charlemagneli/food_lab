<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户设置 · 食研所</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="site-header"></div><main class="form-wrap container"><div class="panel"><span class="eyebrow">Your FoodLab</span><h1>账户设置</h1><form id="profile-settings"><div class="field"><label>用户名</label><input name="username" required minlength="2" maxlength="30"></div><div class="field"><label>邮箱</label><input name="email" type="email" disabled></div><div class="field"><label>个人简介</label><textarea name="bio" rows="4" maxlength="300" placeholder="介绍一下你和食物的故事"></textarea></div><div class="field"><label>兴趣爱好标签</label><input name="interests" placeholder="例如：家常菜,烘焙,咖啡"></div><button class="btn">保存资料</button></form></div><div class="panel" style="margin-top:20px"><h2>修改密码</h2><p class="muted">修改成功后当前登录会话会保留，但请使用新密码重新登录其他设备。</p><form id="password-settings"><div class="field"><label>当前密码</label><input name="current_password" type="password" required></div><div class="field"><label>新密码</label><input name="new_password" type="password" minlength="6" required></div><div class="field"><label>确认新密码</label><input name="confirm_password" type="password" minlength="6" required></div><button class="btn secondary">更新密码</button></form></div></main><div id="site-footer"></div><div id="toast" class="toast"></div><script src="/js/main.js?v=20260821-nav"></script><script src="/js/settings.js"></script></body></html>
